# 场景音乐配置
# 设计稿：doc/架构/详细设计/20261002-工具插件层与情绪音乐设计稿.md
# 概率：0~1，全局默认 + 可按场景覆盖；二期接用户画像后动态调整
# 选中歌曲后从 reason_templates 随机抽一条，{title} 会换成曲名
reason_templates:
  - "主子聊到这茬，奴才斗胆配个曲儿——《{title}》"
  - "这情绪正好，奴才给您按下《{title}》。"
  - "奴才翻出《{title}》，给主子垫一句。"

probability:
  default: 1.0

# 场景 → 歌曲列表；场景名与 doc/场景定义/ 一致
# 每首二选一：file（本地，对应 frontend/public/music/ 下的相对路径）
#            url（外链，生产用，插件层对两种形态无感知）
scene_music:
  职场吐槽:
