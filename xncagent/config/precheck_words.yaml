# 预检词表：命中任一词语，即视为 query 需要进入 LLM 改写（带对话历史）。
#
# 定位（重要）：这只是一个"是否进 LLM 改写"的快速判断通道，
# 失误无妨——多触发只是多带一次历史，宁可多触发，不可漏触发。
# 词表会持续迭代（后续接配置中心）
categories:
  指代:
    - "它"
    - "他"
    - "她"
    - "他们"
    - "这个"
    - "那个"
    - "这些"
    - "那些"
    - "大家"
    - "刚说的"

  对比:
    - "哪个"
    - "哪个更"
    - "比较"
    - "还是"
    - "哪个好"

  省略:
    - "还有"
    - "另外"
    - "继续说"
    - "再讲"
    - "同上"

  反问:
    - "难道"
    - "不会吧"
    - "怎么可能"
    - "凭什么"

  上下文依赖:
    - "上面的"
    - "你刚才"
    - "之前说的"
    - "那个呢"
  
  min_length: 10