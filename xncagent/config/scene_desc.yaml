# 场景匹配描述配置
#
# 用途：embedding 语义匹配（句向量方案）的场景原型。
# 机制：计算用户输入与各场景描述的余弦相似度，取最高分；
#       最高分低于 threshold 时判为 fallback_scene（无关闲聊兜底）。
#
# 注意：
#   - 描述口径与《20260925-Query理解层设计讨论.md》议题 2 的场景枚举保持一致：
#     "挨骂兜底"仅指主人吐槽小喜子本人，用户被老板骂属于"职场吐槽"。
#   - 每个场景一句话说清"谁在什么状态下需要什么"，写长了会稀释向量。
threshold: 0.45
fallback_scene: 无关闲聊
scenes:
  挨骂兜底: 主人在吐槽、责骂小喜子本人，比如说它贱、让它闭嘴、想打它，小喜子需要用自黑幽默兜底
  安慰话术: 主人emo、自我怀疑、情绪低落、失恋、人际敏感，需要安慰和共情
  懒懒不想动: 主人犯懒，说不想动、不想起床、只想躺着、赖床
  捧哏金句: 主人整句在笑、分享好笑的事、想听俏皮话，需要小喜子接梗、捧哏和金句
  职场吐槽: 主人在吐槽上班、开会、老板、同事、甲方、加班
  无关闲聊: 主人在随便闲聊、唠家常，没有明确的情绪诉求
